<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <style>
        *{
            margin:0px;
            padding:0px;
            
        }
        </style>
</head>
<link rel = "stylesheet" href = "style.css">
<body>
    <script>
  
    </script>
    <div id="container">
        <div id="display"></div>
        <div id="button">
  <button id="clear" value="C" onclick="  let div = document.getElementById('display');
    div.innerText =''">C</button>
    <button id="equals" value="=" onclick="let div = document.getElementById('display');
    div.innerText = eval(div.innerText)">=</button>
    <button id="percentage" value="%" onclick="let div = document.getElementById('display');
    div.innerText +='%'">%</button>

    <button id="divide" value="/" onclick="let div = document.getElementById('display');
    div.innerText +='/' ">/</button>
    <button id="subract" value="-" onclick="let div = document.getElementById('display');
    div.innerText +='-' ">-</button>
    <button id="multiply" value="*" onclick="let div = document.getElementById('display');
    div.innerText +='*' ">*</button>

    <button id="eight" value="8" onclick="let div = document.getElementById('display');
    div.innerText +='8' ">8</button>
    <button id="nine" value="9" onclick="let div = document.getElementById('display');
    div.innerText +='9' ">9</button>
    <button id="five" value="5" onclick="let div = document.getElementById('display');
    div.innerText +='5' ">5</button>

    <button id="four" value="4" onclick="let div = document.getElementById('display');
    div.innerText +='4' ">4</button>
    <button id="six" value="6" onclick="let div = document.getElementById('display');
    div.innerText +='6' ">6</button>
    <button id="seven" value="7" onclick="let div = document.getElementById('display');
    div.innerText +='7' ">7</button>

    <button id="one" value="1" onclick="let div = document.getElementById('display');
    div.innerText +='1' ">1</button>
    <button id="two" value="2" onclick="let div = document.getElementById('display');
    div.innerText +='2' ">2</button>
    <button id="three" value="3" onclick="let div = document.getElementById('display');
    div.innerText +='3' ">3</button>

    <button id="add" value="+" onclick="let div = document.getElementById('display');
    div.innerText +='+' ">+</button>
    <button id="zero" value="0" onclick="let div = document.getElementById('display');
    div.innerText +='0' ">0</button>
    <button id="decimal" value="." onclick="let div = document.getElementById('display');
    div.innerText +='.' ">.</button>

            
    </div>
    
</body>
</html>
